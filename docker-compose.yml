name: go-keeper

services:
  postgres:
    container_name: postgres
    image: postgres:latest
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    container_name: redis
    image: redis:latest
    restart: always
    ports:
      - 6379:6379
    environment:
      - REDIS_PASSWORD=redis
    volumes:
      - redis-data:/data

  localstack:
    container_name: localstack
    image: localstack/localstack:latest
    restart: unless-stopped
    ports:
      - 4566:4566 # единый edge-порт для всех AWS-сервисов
    environment:
      - SERVICES=s3,sqs,dynamodb # какие AWS-сервисы поднимать
      - DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - localstack-data:/var/lib/localstack

  adminer:
    container_name: adminer
    image: adminer
    restart: always
    ports:
      - 5050:8080

volumes:
  pg-data: {}
  redis-data: {}
  localstack-data: {}
