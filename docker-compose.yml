name: go-keeper

services:
  postgres:
    container_name: postgres
    image: postgres:latest
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    volumes:
      - pg-data:/var/lib/postgresql

  redis:
    container_name: redis
    image: redis:latest
    restart: unless-stopped
    ports:
      - 6379:6379
    environment:
      - REDIS_PASSWORD=redis
    volumes:
      - redis-data:/data

  adminer:
    container_name: adminer
    image: adminer
    restart: always
    ports:
      - 5050:8080

volumes:
  pg-data: {}
  redis-data: {}
